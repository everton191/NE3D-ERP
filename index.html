<script>
  (() => {
    const allowed = ["light", "system", "dark"];
    const erpKey = "simplifica3d_erp_theme_preference";
    const storeKey = "simplifica3d_store_theme_preference";
    const legacyStoreKey = "simplifica3d_store_theme";
    const getPreference = (key, legacyKey = "") => {
      let value = "";
      try {
        value = localStorage.getItem(key) || (legacyKey ? localStorage.getItem(legacyKey) : "") || "";
      } catch (_) {}
      if (value === "auto") return "system";
      return allowed.includes(value) ? value : "light";
    };
    const resolve = (preference) => {
      if (preference === "light" || preference === "dark") return preference;
      try {
        return window.matchMedia?.("(prefers-color-scheme: dark)")?.matches ? "dark" : "light";
      } catch (_) {
        return "light";
      }
    };
    const erpPreference = getPreference(erpKey);
    const storePreference = getPreference(storeKey, legacyStoreKey);
    const erpTheme = resolve(erpPreference);
    const storeTheme = resolve(storePreference);
    document.documentElement.setAttribute("data-erp-theme", erpTheme);
    document.documentElement.setAttribute("data-erp-theme-preference", erpPreference);
    document.documentElement.setAttribute("data-store-theme", storeTheme);
    document.documentElement.setAttribute("data-store-theme-preference", storePreference);
    document.querySelector('meta[name="theme-color"]')?.setAttribute("content", erpTheme === "dark" ? "#08131d" : "#f2f5f4");
  })();
</script>
