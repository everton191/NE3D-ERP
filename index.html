<script>
  (() => {
    const allowed = ["light", "system", "dark"];
    const erpKey = "simplifica3d:erp-theme-preference";
    const legacyErpKey = "simplifica3d_erp_theme_preference";
    let preference = "";
    try {
      preference = localStorage.getItem(erpKey) || localStorage.getItem(legacyErpKey) || "";
      if (preference) localStorage.setItem(erpKey, preference);
    } catch (_) {}
    if (preference === "auto") preference = "system";
    if (!allowed.includes(preference)) preference = "light";
    let theme = preference;
    if (theme === "system") {
      try {
        theme = window.matchMedia?.("(prefers-color-scheme: dark)")?.matches ? "dark" : "light";
      } catch (_) {
        theme = "light";
      }
    }
    document.documentElement.setAttribute("data-erp-theme", theme);
    document.documentElement.setAttribute("data-erp-theme-preference", preference);
    document.documentElement.classList.add(theme === "dark" ? "theme-dark" : "theme-light");
    document.documentElement.style.colorScheme = theme;
    document.documentElement.style.backgroundColor = theme === "dark" ? "#08131d" : "#ffffff";
    document.querySelector('meta[name="theme-color"]')?.setAttribute("content", theme === "dark" ? "#08131d" : "#ffffff");
  })();
</script>

<script>
  const isNativeApp = window.Capacitor?.isNativePlatform?.() === true;
  if (isNativeApp && "serviceWorker" in navigator) {
    // O WebView já serve os arquivos privados do APK. Um service worker aqui
    // duplicava o carregamento do shell e atrasava a primeira tela.
    navigator.serviceWorker.getRegistrations().then((items) => items.forEach((item) => item.unregister())).catch(() => {});
  } else if ("serviceWorker" in navigator && location.protocol !== "file:") {
    navigator.serviceWorker.register(`/sw.js?build=${encodeURIComponent(window.SIMPLIFICA_BUILD_ID || "unknown")}`, { updateViaCache: "none" }).catch(() => {});
  }
