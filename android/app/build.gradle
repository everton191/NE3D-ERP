apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

def simplificaSigningKeystore = rootProject.file("signing/simplifica-debug.keystore")
def simplificaPilotBuild = project.hasProperty("simplificaPilot") && project.property("simplificaPilot").toString().toBoolean()

android {
    ndkVersion "28.2.13676358"
    namespace = "br.com.ne3d.erp"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId simplificaPilotBuild ? "br.com.ne3d.erp.pilot" : "br.com.ne3d.erp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode simplificaPilotBuild ? 10 : 66
        versionName simplificaPilotBuild ? "0.9.0-pilot" : "1.0.38"
        resValue "string", "app_name", simplificaPilotBuild ? "Simplifica 3D Piloto" : "Simplifica 3D"
        resValue "string", "title_activity_main", simplificaPilotBuild ? "Simplifica 3D Piloto" : "Simplifica 3D"
        manifestPlaceholders = [admobAppId: "ca-app-pub-1056970757696623~2135021978"]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                // CPU-only. Core libraries are shared; nativeInit selects one of the
                // two explicitly packaged ARM CPU modules from nativeLibraryDir.
                arguments '-DBUILD_SHARED_LIBS=ON', '-DGGML_BACKEND_DL=ON', '-DGGML_CPU=ON', '-DGGML_CPU_ALL_VARIANTS=OFF', '-DGGML_OPENMP=OFF'
            }
        }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/functiongemma/CMakeLists.txt' } }
    packaging {
        jniLibs {
            // CMake also creates an unoptimized libggml-cpu.so. Keep only the
            // scored armv8.0 fallback and armv8.2+dotprod modules below.
            excludes += [
                '**/libggml-cpu.so',
                '**/libggml-cpu-android_armv8.2_2.so',
                '**/libggml-cpu-android_armv8.6_1.so',
                '**/libggml-cpu-android_armv9.0_1.so',
                '**/libggml-cpu-android_armv9.2_1.so',
                '**/libggml-cpu-android_armv9.2_2.so'
            ]
        }
    }
    sourceSets {
        // Device smoke tests consume the same immutable PT-BR fixtures used by
        // the desktop evaluator; expected cases are never duplicated in Kotlin.
        androidTest.assets.srcDirs += ['../../training/functiongemma']
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    signingConfigs {
        debug {
            if (!simplificaSigningKeystore.exists()) {
                throw new GradleException("Chave Android estável não encontrada em android/signing/simplifica-debug.keystore")
            }
            storeFile simplificaSigningKeystore
        }
    }
    buildTypes {
        debug {
            manifestPlaceholders = [admobAppId: "ca-app-pub-1056970757696623~2135021978"]
            ndk {
                // APK distribuido a celulares: nao inclua ABI de emulador/PC.
                abiFilters "arm64-v8a"
            }
        }
        release {
            manifestPlaceholders = [admobAppId: "ca-app-pub-1056970757696623~2135021978"]
            ndk {
                abiFilters "arm64-v8a"
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.biometric:biometric:1.1.0"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
