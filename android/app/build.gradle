apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

def simplificaSigningKeystore = rootProject.file("signing/simplifica-debug.keystore")
def simplificaPilotBuild = project.hasProperty("simplificaPilot") && project.property("simplificaPilot").toString().toBoolean()
def playSigningValue = { String name ->
    def value = project.findProperty(name) ?: System.getenv(name)
    return value == null ? "" : value.toString().trim()
}
def playUploadStorePath = playSigningValue("SIMPLIFICA_PLAY_UPLOAD_STORE_FILE")
def playUploadStorePassword = playSigningValue("SIMPLIFICA_PLAY_UPLOAD_STORE_PASSWORD")
def playUploadKeyAlias = playSigningValue("SIMPLIFICA_PLAY_UPLOAD_KEY_ALIAS")
def playUploadKeyPassword = playSigningValue("SIMPLIFICA_PLAY_UPLOAD_KEY_PASSWORD")
def playUploadSigningReady = [playUploadStorePath, playUploadStorePassword, playUploadKeyAlias, playUploadKeyPassword].every { !it.isEmpty() }
def allowUnsignedPlayBundle = project.hasProperty("simplificaAllowUnsignedPlayBundle") && project.property("simplificaAllowUnsignedPlayBundle").toString().toBoolean()

android {
    ndkVersion "28.2.13676358"
    namespace = "br.com.ne3d.erp"
    compileSdk = rootProject.ext.compileSdkVersion
    signingConfigs {
        debug {
            if (!simplificaSigningKeystore.exists()) {
                throw new GradleException("Chave Android estável não encontrada em android/signing/simplifica-debug.keystore")
            }
            storeFile simplificaSigningKeystore
        }
        playUpload {
            if (playUploadSigningReady) {
                storeFile rootProject.file(playUploadStorePath)
                storePassword playUploadStorePassword
                keyAlias playUploadKeyAlias
                keyPassword playUploadKeyPassword
            }
        }
    }
    defaultConfig {
        applicationId simplificaPilotBuild ? "br.com.ne3d.erp.pilot" : "br.com.ne3d.erp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode simplificaPilotBuild ? 10 : 67
        versionName simplificaPilotBuild ? "0.9.0-pilot" : "1.0.39"
        resValue "string", "app_name", simplificaPilotBuild ? "Simplifica 3D Piloto" : "Simplifica 3D"
        resValue "string", "title_activity_main", simplificaPilotBuild ? "Simplifica 3D Piloto" : "Simplifica 3D"
        manifestPlaceholders = [admobAppId: "ca-app-pub-1056970757696623~2135021978"]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                // CPU-only. Core libraries are shared; nativeInit selects one of the
                // two explicitly packaged ARM CPU modules from nativeLibraryDir.
                arguments '-DBUILD_SHARED_LIBS=ON', '-DGGML_BACKEND_DL=ON', '-DGGML_CPU=ON', '-DGGML_CPU_ALL_VARIANTS=OFF', '-DGGML_OPENMP=OFF'
            }
        }
    }
    flavorDimensions += "distribution"
    productFlavors {
        direct {
            dimension "distribution"
            buildConfigField "boolean", "AI_ENABLED", "true"
            buildConfigField "boolean", "SELF_UPDATE_ENABLED", "true"
        }
        play {
            dimension "distribution"
            applicationId "br.com.ne3d.erp"
            resValue "string", "app_name", "Simplifica 3D"
            resValue "string", "title_activity_main", "Simplifica 3D"
            buildConfigField "boolean", "AI_ENABLED", "false"
            buildConfigField "boolean", "SELF_UPDATE_ENABLED", "false"
            if (playUploadSigningReady) {
                signingConfig signingConfigs.playUpload
            }
        }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/functiongemma/CMakeLists.txt' } }
    packaging {
        jniLibs {
            // CMake also creates an unoptimized libggml-cpu.so. Keep only the
            // scored armv8.0 fallback and armv8.2+dotprod modules below.
            excludes += [
                '**/libggml-cpu.so',
                '**/libggml-cpu-android_armv8.2_2.so',
                '**/libggml-cpu-android_armv8.6_1.so',
                '**/libggml-cpu-android_armv9.0_1.so',
                '**/libggml-cpu-android_armv9.2_1.so',
                '**/libggml-cpu-android_armv9.2_2.so'
            ]
        }
    }
    sourceSets {
        // Device smoke tests consume the same immutable PT-BR fixtures used by
        // the desktop evaluator; expected cases are never duplicated in Kotlin.
        androidTest.assets.srcDirs += ['../../training/functiongemma']
        // Canonical model metadata is read by Kotlin from assets and copied to Web dist.
        main.assets.srcDirs += ['../../config']
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    buildFeatures {
        // Compose is required by the native SPB carousel host and its editor (see spbcore/).
        compose true
        buildConfig true
    }
    buildTypes {
        debug {
            manifestPlaceholders = [admobAppId: "ca-app-pub-1056970757696623~2135021978"]
            ndk {
                // APK distribuido a celulares: nao inclua ABI de emulador/PC.
                abiFilters "arm64-v8a"
            }
        }
        release {
            manifestPlaceholders = [admobAppId: "ca-app-pub-1056970757696623~2135021978"]
            ndk {
                abiFilters "arm64-v8a"
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        if (variant.productFlavors.any { flavor -> flavor.first == "distribution" && flavor.second == "play" }) {
            variant.packaging.jniLibs.excludes.addAll([
                "**/libggml*.so",
                "**/libllama.so",
                "**/liblocal_llama_jni.so",
                "**/libneedle_jni.so"
            ])
        }
    }
}

tasks.configureEach { task ->
    if (task.name == "prePlayReleaseBuild") {
        task.doFirst {
            if (!playUploadSigningReady && !allowUnsignedPlayBundle) {
                throw new GradleException("Assinatura Play ausente. Defina SIMPLIFICA_PLAY_UPLOAD_STORE_FILE, SIMPLIFICA_PLAY_UPLOAD_STORE_PASSWORD, SIMPLIFICA_PLAY_UPLOAD_KEY_ALIAS e SIMPLIFICA_PLAY_UPLOAD_KEY_PASSWORD. Para validação técnica sem upload, use -PsimplificaAllowUnsignedPlayBundle=true.")
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.biometric:biometric:1.1.0"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5"

    // Jetpack Compose (native SPB carousel host + editor).
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.10.0'

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
