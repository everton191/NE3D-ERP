# Isolated license homologation: no linked project, remote credentials or seed data.
project_id = "s3d-license-homolog"

[experimental]
stack = true

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
major_version = 17
health_timeout = "2m"

[db.migrations]
enabled = true

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"

[auth.email]
enable_signup = true
enable_confirmations = false

[studio]
enabled = false

[storage]
enabled = true

[realtime]
enabled = false

[analytics]
enabled = false
